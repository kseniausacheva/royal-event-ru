name: Build and Deploy to reg.ru

# Workflow запускается при:
#   - push в ветку main (автоматически после каждого коммита)
#   - вручную через UI GitHub (Actions → Build and Deploy → Run workflow)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Защита от параллельных деплоев: если идёт build, новый push отменит предыдущий.
# Это важно, если ты добавишь несколько статей подряд — задеплоится только последний.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build site and deploy via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Chromium в CI больше не нужен: пререндер — настоящий SSG через
      # react-dom/static (scripts/prerender.mjs), браузер не используется.
      # puppeteer остался в devDeps только для локальных _verify-скриптов —
      # пропускаем скачивание его Chromium (~120 MB).
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      # Build = sitemap → vite build (client, с image optimizer) → vite build --ssr → SSG-prerender
      - name: Build site (sitemap → vite → image-opt → SSG-prerender)
        run: npm run build

      - name: Show build output stats
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo ""
          echo "=== dist size (без videos) ==="
          du -sh dist --exclude=videos 2>/dev/null || du -sh dist
          echo ""
          echo "=== prerendered routes ==="
          find dist -name 'index.html' | sort

      # SMTP-пароль форм не хранится в репозитории: берём из GitHub Secret EMAIL_PASS
      # (Settings → Secrets and variables → Actions) и кладём mail-config.php рядом с contact.php.
      # По HTTP файл закрыт через .htaccess. Без секрета деплой останавливаем — иначе формы сломаются.
      - name: Write mail-config.php from secret
        env:
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          if [ -z "$EMAIL_PASS" ]; then
            echo "::error::Секрет EMAIL_PASS не задан. Добавь пароль приложения Яндекс.Почты в Settings → Secrets and variables → Actions."
            exit 1
          fi
          ESCAPED=$(printf '%s' "$EMAIL_PASS" | sed "s/\\\\/\\\\\\\\/g; s/'/\\\\'/g")
          printf "<?php\nreturn [\n  'user' => 'baxgat@yandex.ru',\n  'pass' => '%s',\n  'host' => 'smtp.yandex.ru',\n  'port' => 465,\n  'recipient' => 'baxgat@yandex.ru',\n];\n" "$ESCAPED" > dist/mail-config.php
          echo "mail-config.php записан ($(wc -c < dist/mail-config.php) байт)"

      # Deploy готовой папки dist/ на reg.ru через FTP.
      # Использует incremental sync — заливает только изменённые файлы (быстро).
      # FTP-credentials лежат в GitHub Secrets (Settings → Secrets and variables → Actions).
      - name: Deploy to reg.ru via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          # protocol: 'ftps' — попробует FTPS (зашифрованный) — большинство хостингов поддерживает.
          # Если reg.ru не принимает FTPS, поменяй на 'ftp' (незашифрованный).
          protocol: ftps
          # security: 'loose' — не проверять сертификат сервера (reg.ru часто использует self-signed).
          security: loose
          # state-name: имя файла где action хранит хеши залитых файлов для incremental sync.
          # Хранится на сервере — после первого деплоя последующие будут быстрее.
          state-name: .ftp-deploy-sync-state.json
          # Не трогаем эти системные файлы/папки на сервере (логи, временные файлы reg.ru)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/logs/**
            **/php-bin/**
            **/php-bin-*/**
            **/bin-tmp/**

      - name: Success notification
        if: success()
        run: |
          echo "✅ Deployed to https://royaleventandmice.ru"
          echo "Проверь через 1-2 минуты (CDN может закэшировать старую версию)."
